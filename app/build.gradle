plugins {
    id 'com.android.application'
}

// The Spicy Lyrics key is never committed. It comes from local.properties
// (spicy.client.key=sl_pk_...) or the SPICY_CLIENT_KEY env var (a CI secret); without
// one the build still works and users paste their own key in Settings.
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) localPropsFile.withInputStream { localProps.load(it) }
def spicyClientKey = (localProps.getProperty('spicy.client.key') ?: System.getenv('SPICY_CLIENT_KEY') ?: '').trim()

android {
    namespace 'com.lyricsync.app'
    compileSdk 35
    // Pinned so the AGP default (34.0.0) is not silently downloaded for an SDK 35 build.
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId "com.lyricsync.app"
        minSdk 26
        targetSdk 35
        versionCode 83
        versionName "16.4.29"
        buildConfigField 'String', 'SPICY_CLIENT_KEY', "\"${spicyClientKey}\""
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            storeFile file('release.keystore')
            storePassword 'android'
            keyAlias 'lyricsync'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def abi = output.getFilter(com.android.build.OutputFile.ABI)
            def suffix = abi != null ? "-${abi}" : ""
            outputFileName = "LyricSync-v${variant.versionName}${suffix}.apk"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.13.1'
    implementation 'androidx.palette:palette:1.0.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'androidx.core:core:1.12.0'

    // Markwon Markdown Renderer
    implementation 'io.noties.markwon:core:4.6.2'
    implementation 'io.noties.markwon:ext-strikethrough:4.6.2'
    implementation 'io.noties.markwon:ext-tables:4.6.2'
    implementation 'io.noties.markwon:linkify:4.6.2'

    testImplementation 'junit:junit:4.13.2'
}
