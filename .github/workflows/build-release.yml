name: Build & Send APK

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

# A newer push to the same branch/PR cancels the run still going for the old
# one. Tag builds are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

jobs:
  # Branch pushes, pull requests and manual runs: unit tests, lint and the
  # debug APK. Tags build the minified release in the `release` job below.
  build:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17 (with Gradle cache)
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Unit tests, lint and debug APK
        env:
          SPICY_CLIENT_KEY: ${{ secrets.SPICY_CLIENT_KEY }}
        run: >-
          ./gradlew testDebugUnitTest lintDebug assembleDebug
          --no-daemon --stacktrace

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: LyricSync-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore

      - name: Find APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          ls -la "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: LyricSync-debug
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      # Values come in through env (never ${{ }} inside the script), so a
      # commit message cannot inject shell code.
      - name: Send to Telegram
        if: github.event_name == 'push'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APK_PATH: ${{ steps.apk.outputs.path }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets not set; skipping (APK is an artifact)."
            exit 0
          fi
          api="https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}"
          resp=$(curl -s -X POST "$api/sendDocument" \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "document=@${APK_PATH}" \
            -F "caption=LyricSync debug build — ${COMMIT_MSG}")
          case "$resp" in
            *'"ok":true'*) echo "OK" ;;
            *) echo "FAIL: $resp" ;;
          esac

  # Tag push (v*): build the minified, R8-optimised release APK and publish
  # it on a GitHub Release page with auto-generated notes.
  release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17 (with Gradle cache)
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Unit tests and release APK (minified)
        env:
          SPICY_CLIENT_KEY: ${{ secrets.SPICY_CLIENT_KEY }}
        run: >-
          ./gradlew testDebugUnitTest assembleRelease
          --no-daemon --stacktrace

      - name: Find release APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          ls -la "$APK"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: LyricSync-release
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: LyricSync ${{ github.ref_name }}
          generate_release_notes: true
          files: ${{ steps.apk.outputs.path }}

      - name: Send release to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APK_PATH: ${{ steps.apk.outputs.path }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets not set; skipping (APK is on the Release)."
            exit 0
          fi
          api="https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}"
          resp=$(curl -s -X POST "$api/sendDocument" \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "document=@${APK_PATH}" \
            -F "caption=LyricSync ${TAG_NAME} — minified release build")
          case "$resp" in
            *'"ok":true'*) echo "OK" ;;
            *) echo "FAIL: $resp" ;;
          esac
